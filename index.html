<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>User Info</h1>
    <form action="" id="form">
    <input type="text" id="INname">
    <input type="number" id="INage">
    <input type="submit">
    </form>
    <p>Name: <span id="name"></span> ,Age: <span id="age"></span></p>
</body>

<script>

const username = document.getElementById("name")
const userage = document.getElementById("age")
const form = document.getElementById("form")

userage.innerText = localStorage.getItem("age") || ""
username.innerText = localStorage.getItem("name") || ""

form.addEventListener("submit", (e)=>{
    localStorage.setItem("name",document.getElementById("INname").value)
    localStorage.setItem("age",document.getElementById("INage").value)
    userage = localStorage.getItem("age") || ""
    username = localStorage.getItem("name") || ""
});
</script>

</html>
